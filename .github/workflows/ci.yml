name: Проверка TS-контрактов и native Quarto

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/course-pl-cache
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Получение проверяемого ядра курса
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          # Core 9: независимо проверенный исходный код; полный hosted CI и выпуск отдельно.
          ref: 8aba3b47df161c98645f3fc268adefc2e96ef8d3
          path: .ci-deps/core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C .ci-deps/core rev-parse HEAD
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "8aba3b47df161c98645f3fc268adefc2e96ef8d3"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - name: Самодостаточная проверка контекста ABI 1
        run: quarto run tests/performance-context.ts
      - name: Прежние разрешения окружения без активного агента
        run: quarto run tests/performance-permissions.ts
      - name: Проверить состав исполняемых TS-контрактов
        run: quarto run tools/check-contracts.ts
      - name: ABI и frozen native auxiliary env
        run: quarto run tests/performance-native-auxiliary.ts
      - name: Граница native capture без legacy child
        run: quarto run tests/performance-native-boundary.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 0b62c6501d716a634e0d1e3fcc3d21e41142b5a1
          path: .ci-deps/qrc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: 21abbbe40a66cbdc1f0185d09b9f6710e20f140b
          path: .ci-deps/site
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: a621ec302a701d7409616f47675d2df0afb87aca
          path: .ci-deps/download
          persist-credentials: false
      - name: Проверить закреплённые QRC, Site и Download
        run: |
          test "$(git -C .ci-deps/qrc rev-parse HEAD)" = "0b62c6501d716a634e0d1e3fcc3d21e41142b5a1"
          test "$(git -C .ci-deps/site rev-parse HEAD)" = "21abbbe40a66cbdc1f0185d09b9f6710e20f140b"
          test "$(git -C .ci-deps/download rev-parse HEAD)" = "a621ec302a701d7409616f47675d2df0afb87aca"
      - name: Настоящие закрытые answers, HTML/Reveal и grading composition
        run: quarto run tests/native-answers-integration.ts .ci-deps/core --author
      - name: Отказ несовместимого cross-document grading
        run: quarto run tests/native-answers-integration.ts .ci-deps/core --wrong-grading
      - name: Выбранные байты и точные имена без source origin
        run: quarto run tests/native-raw-origin-values.ts .ci-deps/core
      - name: Полные reference sources без student ZIP policy
        run: quarto run tests/native-reference-projection.ts .ci-deps/core
      - name: Обычная публикация и скрытые common sources
        run: quarto run tests/native-publication-sources.ts .ci-deps/core
      - name: Версии инструментов
        run: |
          quarto --version
      - name: Проверка правил PrairieLearn и сборка примера student/full
        run: quarto run tests/check.ts .ci-deps/core .ci-deps/qrc .ci-deps/download

  java-delivery:
    name: Installed native questions and Java/Gradle
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/course-pl-cache
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 8aba3b47df161c98645f3fc268adefc2e96ef8d3
          path: .ci-deps/core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C .ci-deps/core rev-parse HEAD
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "8aba3b47df161c98645f3fc268adefc2e96ef8d3"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 0b62c6501d716a634e0d1e3fcc3d21e41142b5a1
          path: .ci-deps/qrc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: a621ec302a701d7409616f47675d2df0afb87aca
          path: .ci-deps/download
          persist-credentials: false
      - name: Проверить закреплённые QRC и Download
        run: |
          test "$(git -C .ci-deps/qrc rev-parse HEAD)" = "0b62c6501d716a634e0d1e3fcc3d21e41142b5a1"
          test "$(git -C .ci-deps/download rev-parse HEAD)" = "a621ec302a701d7409616f47675d2df0afb87aca"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.11.5
      - name: Карта типов фактического Core для штатных compiler entries
        run: quarto run tools/native-core-import-map.ts .ci-deps/core .ci-deps/pl-native-imports.json .ci-deps/qrc .ci-deps/download
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '9.1.0'
      - name: Настоящий Gradle эталон и отказ незавершённого starter
        run: |
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          bash tools/check-java.sh
      - run: deno test --no-config --import-map .ci-deps/pl-native-imports.json --allow-read --allow-write --allow-run --allow-env tests/export.test.ts tests/export-course.test.ts tests/text-runtime.test.ts tests/completion.test.ts tests/grading-policy.test.ts tests/slots.test.ts tests/manual-mixed.test.ts tests/functional-selected-files.test.ts tests/native-seed-policy.test.ts tests/git-transport.test.ts tests/publication-conditions.test.ts tests/public-tests.test.ts tests/body-projection.test.ts tests/java-build.test.ts tests/whole-bank.test.ts
      - name: Атомарный экспорт между файловыми системами
        run: PL_EXDEV_TEST_DIR=/dev/shm deno test --no-config --import-map .ci-deps/pl-native-imports.json -A --filter "functional export v5" tests/export-course.test.ts
      - name: Профили исходников Java, starter/API/Gradle и native delivery
        run: deno test --no-config --import-map .ci-deps/pl-native-imports.json --allow-read --allow-write --allow-run --allow-env tests/java-build.test.ts tests/native-contract-batch.test.ts tests/native-batch-checkpoint.test.ts tests/native-selection.test.ts tests/native-origin-scope.test.ts tests/native-verification-inventory.test.ts tests/native-seed-policy.test.ts tests/native-auxiliary.test.ts

  static:
    name: Строгая проверка собственного кода
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/course-pl-cache
      PERFORMANCE: ${{ github.workspace }}/.ci-deps/performance
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/.ci-deps/performance
      LUA_LANGUAGE_SERVER: ${{ github.workspace }}/.ci/luals/bin/lua-language-server
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 8aba3b47df161c98645f3fc268adefc2e96ef8d3
          path: .ci-deps/core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 0b62c6501d716a634e0d1e3fcc3d21e41142b5a1
          path: .ci-deps/qrc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: a621ec302a701d7409616f47675d2df0afb87aca
          path: .ci-deps/download
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-performance
          ref: 0781f03a11f461691d7ce116f2c53bb5d8af68d7
          path: .ci-deps/performance
          persist-credentials: false
      - name: Проверить закреплённые исходники статических проверок
        run: |
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "8aba3b47df161c98645f3fc268adefc2e96ef8d3"
          test "$(git -C .ci-deps/qrc rev-parse HEAD)" = "0b62c6501d716a634e0d1e3fcc3d21e41142b5a1"
          test "$(git -C .ci-deps/download rev-parse HEAD)" = "a621ec302a701d7409616f47675d2df0afb87aca"
          test "$(git -C "$PERFORMANCE" rev-parse HEAD)" = "0781f03a11f461691d7ce116f2c53bb5d8af68d7"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.11.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
      - name: Карта типов фактических публичных providers
        run: quarto run tools/native-core-import-map.ts .ci-deps/core .ci-deps/pl-native-imports.json .ci-deps/qrc .ci-deps/download
      - name: Полный строгий TS graph и запрет explicit any
        run: |
          timeout --kill-after=3s 180s deno run --no-config -A tools/check-types.ts .ci-deps/pl-native-imports.json
          deno run --no-config -A tools/check-types.ts --lint
      - name: Установить закреплённые зависимости CJS-проверки
        run: npm ci --ignore-scripts
      - name: Строгая проверка собственного CJS
        run: npm run typecheck:tools -- --pretty false
      - name: Строгая проверка четырёх собственных Python-файлов
        run: npm exec --yes --package=pyright@1.1.414 -- pyright --project pyrightconfig.json --pythonpath "${{ steps.python.outputs.python-path }}" --outputjson
      - name: Единственная установка canonical LuaLS
        run: bash "$PERFORMANCE/tools/setup-lua-ci.sh" "$GITHUB_WORKSPACE/.ci/luals"
      - name: Строгая проверка двух собственных Lua-файлов
        run: timeout --kill-after=3s 60s quarto run "$PERFORMANCE/tools/check-lua.ts" --root "$GITHUB_WORKSPACE" --server "$LUA_LANGUAGE_SERVER" --scope _extensions/course-prairielearn/observability/bridge.lua --scope _extensions/course-prairielearn/filter.lua
      - name: Установить закреплённый ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck-0.11.0"
          mkdir -- "$tool_dir"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tool_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$tool_dir/archive.tar.xz" --directory "$tool_dir" --strip-components=1
          "$tool_dir/shellcheck" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Синтаксис и строгая проверка shell по каждому диалекту
        run: |
          bash -n tools/check-java.sh
          sh -n examples/java-gradle/bank/projects/clamp/tests/grade.sh
          shellcheck --norc --enable=all --severity=style --shell=bash tools/check-java.sh
          shellcheck --norc --enable=all --severity=style --shell=sh examples/java-gradle/bank/projects/clamp/tests/grade.sh
