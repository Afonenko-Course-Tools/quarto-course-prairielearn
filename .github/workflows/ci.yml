name: Проверка Quarto и CUE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.10.18", "1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Получение проверяемого ядра курса
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          # Согласованный коммит миграции ядра; обновляется вместе с адаптером.
          ref: 3bfe4e6082b3be0584512b21c3e8134b26ccea30
          path: .ci-deps/core
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - name: Проверка единого словаря контракта
        run: quarto run tools/sync-contract.ts --check
      - name: Версии инструментов
        run: |
          quarto --version
          cue version
      - name: Проверка правил PrairieLearn и сборка примера student/full
        run: quarto run tests/check.ts .ci-deps/core
