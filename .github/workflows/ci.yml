name: Проверка TS-контрактов и native Quarto

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Получение проверяемого ядра курса
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          # Core 9: независимо проверенный исходный код; полный hosted CI и выпуск отдельно.
          ref: 04c189fccfaa56badfc079f7be46fea4969ccf37
          path: .ci-deps/core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C .ci-deps/core rev-parse HEAD
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "04c189fccfaa56badfc079f7be46fea4969ccf37"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - name: Самодостаточная проверка контекста ABI 1
        run: quarto run tests/performance-context.ts
      - name: Прежние разрешения окружения без активного агента
        run: quarto run tests/performance-permissions.ts
      - name: Проверить состав исполняемых TS-контрактов
        run: quarto run tools/check-contracts.ts
      - name: ABI и frozen native auxiliary env
        run: quarto run tests/performance-native-auxiliary.ts
      - name: Граница native capture без legacy child
        run: quarto run tests/performance-native-boundary.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c
          path: .ci-deps/qrc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: e0efd6b5428412500569d0da5a5e0b33d62a5663
          path: .ci-deps/site
          persist-credentials: false
      - name: Проверить закреплённые QRC и Site
        run: |
          test "$(git -C .ci-deps/qrc rev-parse HEAD)" = "798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c"
          test "$(git -C .ci-deps/site rev-parse HEAD)" = "e0efd6b5428412500569d0da5a5e0b33d62a5663"
      - name: Настоящие закрытые answers, HTML/Reveal и grading composition
        run: quarto run tests/native-answers-integration.ts .ci-deps/core --author
      - name: Отказ несовместимого cross-document grading
        run: quarto run tests/native-answers-integration.ts .ci-deps/core --wrong-grading
      - name: Подлинные source origin и три различные hash-области
        run: quarto run tests/native-raw-origin-values.ts .ci-deps/core
      - name: Обычная публикация и скрытые common sources
        run: quarto run tests/native-publication-sources.ts .ci-deps/core
      - name: Версии инструментов
        run: |
          quarto --version
      - name: Проверка правил PrairieLearn и сборка примера student/full
        run: quarto run tests/check.ts .ci-deps/core

  java-delivery:
    name: Installed native questions and Java/Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 04c189fccfaa56badfc079f7be46fea4969ccf37
          path: .ci-deps/core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C .ci-deps/core rev-parse HEAD
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "04c189fccfaa56badfc079f7be46fea4969ccf37"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.11.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.1.0'
      - name: Настоящий Gradle эталон и отказ незавершённого starter
        run: |
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          bash tools/check-java.sh
      - run: deno test --no-config --allow-read --allow-write --allow-run --allow-env tests/export.test.ts tests/export-course.test.ts tests/text-runtime.test.ts tests/completion.test.ts tests/grading-policy.test.ts tests/slots.test.ts tests/manual-mixed.test.ts tests/materialized-student.test.ts tests/native-seed-policy.test.ts tests/git-transport.test.ts tests/publication-conditions.test.ts tests/publication-conditions-entry.test.ts tests/public-cases.test.ts tests/body-projection.test.ts tests/java-build.test.ts tests/whole-bank.test.ts
      - name: Атомарный экспорт между файловыми системами
        run: PL_EXDEV_TEST_DIR=/dev/shm deno test --no-config -A --filter "across output filesystems" tests/export-course.test.ts
      - name: Профили исходников Java, starter/API/Gradle и native delivery
        run: deno test --no-config --allow-read --allow-write --allow-run --allow-env tests/java-build.test.ts tests/native-contract-batch.test.ts tests/native-reuse-refusal.test.ts tests/native-selection.test.ts tests/native-origin-scope.test.ts tests/native-verification-inventory.test.ts tests/native-seed-policy.test.ts tests/native-auxiliary.test.ts
