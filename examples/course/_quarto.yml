fail-if-warnings: true
project:
  type: book
  pre-render:
    - _extensions/course-core/entrypoints/pre.ts
  post-render: _extensions/course-core/entrypoints/post.ts
  output-dir: _book/full
  resources:
    - "!projects/**"
book:
  repo-url: https://github.com/Afonenko-Course-Tools/quarto-course-prairielearn
  repo-branch: main # unreleased 4.0.0 candidate; pin release tag after publication
  repo-subdir: examples/course
  repo-actions: [source]
  title: Задание с внешней проверкой
  chapters:
    - index.qmd
    - tasks/index.qmd
    - labs/01.qmd
    - controls/ranges.qmd
format:
  html:
    theme: cosmo
    code-tools: false
lang: ru
course:
  id: demo-prairielearn
  validate: true
  adapters: [prairielearn]
  view: full
filters:
  - course-core
  - course-prairielearn
profile:
  default: full
  group: [[student, full]]
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 2
    assignment:
      mode: assessment-id
